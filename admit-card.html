<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admit Card | MO Olympiad</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- HEADER -->

  <header class="header">

    <div class="brand">

      <div class="logo">
        MO
      </div>

      <div>

        <b>
          MO Olympiad
        </b>

        <small>
          Admit Card
        </small>

      </div>

    </div>


    <button
      class="menu"
      type="button"
      onclick="
        document
          .querySelector('.nav')
          .classList
          .toggle('show')
      "
    >
      ☰
    </button>


    <nav class="nav">

      <a href="index.html">
        Home
      </a>

      <a href="register.html">
        Registration
      </a>

      <a href="login.html">
        Student Login
      </a>

      <a
        class="active"
        href="admit-card.html"
      >
        Admit Card
      </a>

      <a href="result.html">
        Result
      </a>

    </nav>

  </header>



  <!-- MAIN -->

  <main class="page">

    <div class="lookup">

      <h1>
        🎫 Download Admit Card
      </h1>


      <p class="muted">

        Enter your approved registration ID
        to view and download your admit card.

      </p>


      <form
        id="admitSearch"
        autocomplete="off"
      >

        <input
          id="admitId"
          required
          placeholder="e.g. MO20260001"
          autocomplete="off"
        >


        <button
          class="btn primary"
          type="submit"
        >
          🔍 Search
        </button>

      </form>


      <div
        id="admitOutput"
        aria-live="polite"
      ></div>

    </div>

  </main>



  <!-- FOOTER -->

  <footer>

    ©
    <span id="year"></span>
    MO Olympiad

  </footer>



  <!-- COMMON APP -->

  <script src="app.js"></script>


  <!-- IMPORTANT: admit.js MUST be a module -->

  <script
    type="module"
    src="admit.js"
  ></script>


</body>

</html>
