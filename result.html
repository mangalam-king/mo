<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Result | MO Olympiad</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    .result-card {
      max-width: 700px;
      margin: 25px auto;
    }

    .result-header {
      text-align: center;
      padding: 25px;
    }

    .result-header h2 {
      margin-bottom: 5px;
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    .result-table td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    .result-table td:first-child {
      font-weight: 700;
      width: 45%;
    }

    .marks {
      font-size: 32px;
      font-weight: 800;
      text-align: center;
      margin: 20px 0;
    }

    .qualified {
      padding: 10px 18px;
      border-radius: 30px;
      display: inline-block;
      font-weight: 700;
      background: #dff7e7;
      color: #137333;
    }

    .not-qualified {
      padding: 10px 18px;
      border-radius: 30px;
      display: inline-block;
      font-weight: 700;
      background: #ffe5e5;
      color: #b00020;
    }

    .certificate-box {
      margin-top: 25px;
      padding: 20px;
      border-radius: 15px;
      background: #f5f7ff;
      text-align: center;
    }

    .certificate-number {
      font-size: 18px;
      font-weight: 800;
      margin: 10px 0 18px;
    }

    .result-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    @media print {

      body * {
        visibility: hidden;
      }

      #printResult,
      #printResult * {
        visibility: visible;
      }

      #printResult {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }

      .result-actions {
        display: none !important;
      }

    }

  </style>

</head>


<body>


  <!-- HEADER -->

  <header class="header">

    <div class="brand">

      <div class="logo">
        MO
      </div>

      <div>

        <b>
          MO Olympiad
        </b>

        <small>
          Results
        </small>

      </div>

    </div>


    <button
      class="menu"
      type="button"
      onclick="
        document
          .querySelector('.nav')
          .classList
          .toggle('show')
      "
    >
      ☰
    </button>


    <nav class="nav">

      <a href="index.html">
        Home
      </a>

      <a href="register.html">
        Registration
      </a>

      <a href="login.html">
        Student Login
      </a>

      <a href="admit-card.html">
        Admit Card
      </a>

      <a
        class="active"
        href="result.html"
      >
        Result
      </a>

    </nav>

  </header>



  <!-- MAIN -->

  <main class="page">

    <div class="lookup">

      <h1>
        📊 Check Result
      </h1>


      <p class="muted">

        Enter your registration ID
        to view your result.

      </p>


      <form
        id="resultSearch"
        autocomplete="off"
      >

        <input
          id="resultId"
          required
          placeholder="e.g. MO20260001"
          autocomplete="off"
        >


        <button
          class="btn primary"
          type="submit"
        >

          🔍 Check Result

        </button>

      </form>


      <div
        id="resultOutput"
        aria-live="polite"
      ></div>

    </div>

  </main>



  <footer>

    ©
    <span id="year"></span>
    MO Olympiad

  </footer>


  <script src="app.js"></script>

  <!-- IMPORTANT -->

  <script
    type="module"
    src="result.js"
  ></script>


</body>

</html>
